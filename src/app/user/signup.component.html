<div class="auth-container">
  <div class="auth-card" *ngIf="!isLoggedIn">
    <div class="auth-header">
      <div class="auth-icon">
        <i class="material-icons">person_add</i>
      </div>
      <h3>Create Account</h3>
      <p class="auth-subtitle">Register to manage your contact lenses</p>
    </div>

    <form (ngSubmit)="save()" [formGroup]="userForm" class="auth-form">
      <div class="form-row">
        <div class="form-group">
          <label for="firstName" class="form-label">First Name</label>
          <input
            id="firstName"
            type="text"
            class="form-control"
            formControlName="firstName"
            placeholder="Enter first name">
        </div>

        <div class="form-group">
          <label for="lastName" class="form-label">Last Name</label>
          <input
            id="lastName"
            type="text"
            class="form-control"
            formControlName="lastName"
            placeholder="Enter last name">
        </div>
      </div>

      <div class="form-group">
        <label for="email" class="form-label">Email</label>
        <input
          id="email"
          type="email"
          class="form-control"
          formControlName="email"
          placeholder="name@example.com">
      </div>

      <div class="form-group">
        <label for="username" class="form-label">Username</label>
        <input
          id="username"
          type="text"
          class="form-control"
          formControlName="username"
          placeholder="Choose a username">
      </div>

      <div class="form-group">
        <label for="password" class="form-label">Password</label>
        <input
          id="password"
          type="password"
          class="form-control"
          formControlName="password"
          placeholder="Create a password">
      </div>

      <div class="form-actions">
        <button type="submit" class="btn btn-primary btn-block">
          Create Account
        </button>
        <button type="button" class="btn btn-secondary btn-block" routerLink="/">
          Cancel
        </button>
      </div>

      <div class="auth-footer">
        <p>Already have an account? <a routerLink="/account/login">Sign in</a></p>
      </div>
    </form>
  </div>
</div>
